schema_version: 1
platform: codex
state_dir: .agent-ascendry
agents:
  paths:
    - .codex/agents
  curator:
    id: agent_curator
    install_if_missing: false
skills:
  paths:
    - .agents/skills
validation:
  timeout_seconds: 300
  commands:
    -
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
    -
      - python
      - -m
      - warden_drydock
      - --help
apply:
  allowed_paths:
    - AGENTS.md
    - .codex/agents
    - .agents/skills
  git:
    enabled: true
    base_branch: master
    branch_prefix: codex/agent-ascendry-
    remote: origin
    pull_request: false
privacy:
  persist_transcript_content: false
